<script>
const D=JSON.parse(document.getElementById('data').textContent);
const IC=JSON.parse(document.getElementById('icons').textContent);
const BULB=document.getElementById('bulb').innerHTML;
const FLIP=document.getElementById('flipicon').innerHTML;
if(location.search.includes('img'))document.body.classList.add('img');
const esc=s=>s;
function card(n,s){
 const tag=s.tag?`<span class="tag">${s.tag}</span>`:'';
 const nums=s.nums&&s.nums.length?`<div class="nums">${s.nums.map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join('')}</div>`:'';
 const why=s.why?`<p class="why">${BULB}<span><strong>Why it matters:</strong> ${s.why}</span></p>`:'';
 const flip=s.flip?`<p class="flip">${FLIP}<span><strong>Other side:</strong> ${s.flip}</span></p>`:'';
 const more=(s.url2?` <a class="more" href="${s.url2}" target="_blank" rel="noopener">also</a>`:'');
 return `<article class="card c-${s.a}${s.wide?' wide':''}"><div class="top"><span class="badge"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[s.i]||''}</svg></span><div class="hd"><div class="meta"><span class="num">${n}</span><span class="cat">${s.cat}</span>${tag}</div><h3>${s.url?`<a href="${s.url}" target="_blank" rel="noopener">${s.title}</a>`:s.title}${more}</h3></div></div><ul>${s.pts.map(p=>`<li>${p}</li>`).join('')}</ul>${nums}${why}${flip}</article>`;
}
function section(label,key,items){return `<section class="ed" id="${key}"><div class="edh"><span class="pill p-${key}">${label}</span><span class="rule r-${key}"></span></div><div class="grid">${items.map((s,i)=>card(i+1,s)).join('')}</div></section>`;}
const date=D.date||new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).replace(',', ',');
document.getElementById('mdate').textContent=date;
document.title='The Reddy Reckoner, '+date;
document.getElementById('content').innerHTML=
 `<div class="callout">${D.callout.map(c=>{const o=c.url?`<a href="${c.url}" target="_blank" rel="noopener">`:'',x=c.url?'</a>':'';return `<div><span class="big">${o}${c.num}${x}</span><p>${o}<b>${c.lead}</b>${x}${c.rest}</p></div>`}).join('')}</div>`+
 (D.featured&&D.featured.length?section('Pick of the day','feat',D.featured):'')+section('India edition','india',D.india)+section('World edition','world',D.world)+
 (D.reading&&D.reading.length?`<section class="reading"><h4>Further reading</h4><ul>${D.reading.map(r=>`<li><a href="${r.url}" target="_blank" rel="noopener">${r.title}</a>${r.note?` — ${r.note}`:''}</li>`).join('')}</ul></section>`:'')+
 `<p class="slice"><b>Today’s slice</b><span>${D.slice}</span></p>`;
</script></body></html>
