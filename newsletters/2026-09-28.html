:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--page:#EFE7F5;--bg:#FFF8F1;--ink:#1F1640;--muted:#5A5470;--line:rgba(31,22,64,.12);--card:#FFFFFF;--plum:#2B1348;--gold:#FFC94D;

:root[data-theme="dark"]{--page:#150E24;--bg:#1C1430;--ink:#F2EEFA;--muted:#B9B1CC;--line:rgba(255,255,255,.12);--card:#261C3D;--o-t:#3A2515;--y-t:#382E14;--t-t:#16322F;--v-t:#2B2248;--p-t:#3A1B2A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--ink);font-family:'Heros','Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.page{max-width:1024px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column}
.canvas{width:1024px;height:1536px;overflow:hidden}
.mast img{display:block;width:100%;height:auto;max-width:100%}
.inner{flex:1;display:flex;flex-direction:column;gap:10px;padding:12px 20px 12px;min-height:0}
.c-o{--a:var(--o);--at:var(--o-t)}.c-y{--a:var(--y);--at:var(--y-t)}.c-t{--a:var(--t);--at:var(--t-t)}.c-v{--a:var(--v);--at:var(--v-t)}.c-p{--a:var(--p);--at:var(--p-t)}
.callout{background:linear-gradient(95deg,#F76707 0%,#E64980 55%,#7048E8 100%);color:#fff;border-radius:12px;display:grid;grid-template-columns:1fr 1fr;flex:none}
.callout>div{display:flex;align-items:center;gap:14px;padding:10px 18px}
.callout>div+div{border-left:1px solid rgba(255,255,255,.35)}
.big{font-family:'Pagella',Palatino,Georgia,serif;font-weight:700;font-size:34px;line-height:1;color:#FFF3B0;white-space:nowrap}
.callout p{font-size:14px;line-height:1.3}.callout b{color:#fff}
.ed{display:flex;flex-direction:column;gap:7px}
.edh{display:flex;align-items:center;gap:10px}
.pill{font:700 14.5px/1 'Heros',Helvetica,sans-serif;color:#fff;padding:7px 13px;border-radius:7px;white-space:nowrap}
.p-india{background:linear-gradient(90deg,#F76707,#E64980)}.p-world{background:linear-gradient(90deg,#E64980,#7048E8)}
.rule{flex:1;height:2px;border-radius:2px}.r-india{background:linear-gradient(90deg,#F7670766,transparent)}.r-world{background:linear-gradient(90deg,#7048E866,transparent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 13px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 6px rgba(43,19,72,.06);border-left:5px solid var(--a)}
.top{display:flex;gap:10px;align-items:center}

.hd{flex:1;min-width:0}
.meta{display:flex;align-items:center;gap:7px}
.num{width:19px;height:19px;border-radius:50%;background:var(--a);color:#fff;display:grid;place-items:center;font:700 11px/1 'Heros',sans-serif;flex:none}
.cat{font-size:12.5px;font-weight:700;color:var(--a)}
.tag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted)}
.card h3{font-family:'Pagella',Palatino,Georgia,serif;font-weight:700;font-size:19.5px;line-height:1.18;margin-top:2px}
.card h3 a{color:inherit;text-decoration:none}
.card h3 a:hover{text-decoration:underline}
.more{font:700 11px/1 'Heros',sans-serif;color:var(--a)!important;margin-left:4px;vertical-align:middle}
body.img .more{display:none}
.card ul{list-style:none;display:flex;flex-direction:column;gap:2px}
.card li{font-size:14.8px;line-height:1.36;padding-left:12px;position:relative}
.card li::before{content:"";position:absolute;left:0;top:.52em;width:6px;height:6px;border-radius:50%;background:var(--a)}
.nums{display:flex;background:var(--at);border-radius:8px;padding:6px 10px}
.nums div{flex:1;min-width:0}
.nums div+div{border-left:1px solid var(--line);padding-left:9px;margin-left:9px}
.nums b{display:block;font-family:'Pagella',Palatino,Georgia,serif;font-weight:700;font-size:19px;line-height:1.05;color:var(--a);white-space:nowrap}
.nums span{display:block;font-size:11.5px;line-height:1.2;color:var(--muted)}
.why{display:flex;gap:6px;font-size:14px;line-height:1.3}
.why svg{width:15px;height:15px;flex:none;fill:none;stroke:var(--a);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.why strong{font-weight:700}
.card.wide{grid-column:1/-1;display:grid;grid-template-columns:1.25fr 1.1fr 1.3fr;align-items:center;gap:14px}
.callout a{color:inherit;text-decoration:none}.callout a:hover{text-decoration:underline}
.card.wide .why{grid-column:1/-1}
.slice{flex:none;display:flex;align-items:center;gap:10px;background:#FFF0F6;border:1px dashed #E6498066;border-radius:10px;padding:8px 14px;font-family:'Pagella',Palatino,Georgia,serif;font-style:italic;font-size:15.5px;color:#5A1A3F}
.slice b{font-style:normal;font-weight:700;color:#D6336C;white-space:nowrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .slice{background:#3A1B2A;color:#FBD5E5}}
.foot{flex:none;background:var(--plum);color:#fff;display:flex;align-items:center;gap:18px;padding:14px 22px}
.foot .cake{width:112px;height:auto;flex:none;transform:rotate(-4deg)}
.say{display:inline-block;vertical-align:middle;margin-left:8px;font:italic 400 13px/1 'Pagella',Palatino,Georgia,serif;color:#2B1348;background:#FFC94D;padding:4px 9px 5px;border-radius:999px;transform:rotate(-3deg)}
.pkt{font-family:'Pagella',Palatino,Georgia,serif;font-weight:700;font-size:32px;line-height:1.05;color:var(--gold)}
.pks{font-family:'Pagella',Palatino,Georgia,serif;font-style:italic;font-size:20px;color:#fff;margin-top:2px}
.disc{margin-left:auto;text-align:right;font-size:13.5px;line-height:1.45;color:#EDE3FF}
a:focus-visible{outline:2px solid #E64980;outline-offset:2px}

.brand{display:flex;flex-direction:column;gap:2px}

.brand .pks{font-size:15px;margin-top:0;padding-left:2px}
.foot{align-items:center;padding-top:6px;padding-bottom:8px}
.foot{align-items:center;padding-top:6px;padding-bottom:8px}

.card h3{font-size:20px}.card li{font-size:15.6px;line-height:1.45}.why{font-size:14.8px}

.inner{gap:12px}.grid{gap:10px}

.f-left{display:flex;flex-direction:column}
.f-title{display:flex;align-items:flex-end;line-height:1}
.ap{font:700 36px/1 'Pagella',Palatino,Georgia,serif;background:linear-gradient(180deg,#FFE9A8 0%,#F5BA4B 55%,#D98A1E 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:14px}

.cakeimg{height:84px;width:auto;margin:-18px 0 0 -2px;display:block}

.vr{width:1.5px;height:52px;background:#E3B04B;border-radius:1px}.vr.thin{width:1px;height:48px;background:rgba(255,255,255,.3)}

.foot3{margin-top:0}
