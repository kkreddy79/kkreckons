e hypothesis, a 27-year-old assumption that some hard problems take exponentially more effort as they grow. Both posted the proofs on GitHub, in plain language and in the machine-checkable Lean format.","Independent researchers have not verified them yet. OpenAI has asked the UC San Diego scientists who proposed the hypothesis to rally volunteers and has promised to fund a conference.","Reactions are split. Linköping's Peter Jonsson says much of his upcoming conference paper no longer works, while Copenhagen's Thore Husfeldt calls it a once-in-a-generation result but says the steady run of AI results has left colleagues demoralised."],"nums":[["27 yrs","Age of the hypothesis the labs say is false","clock"]],"why":"If the proofs hold, a large body of theory built on the idea that certain problems cannot be solved quickly has to be redrawn. Cryptography rests on similar too-slow-to-solve assumptions, so its designers will be watching. It also shows AI labs now racing on frontier maths, not just chatbots.","flip":"Nothing is settled until people check the proofs. Machine checking confirms the logic, but humans still have to confirm the formal statement says what the hypothesis says. And after earlier rushed AI paper dumps with errors, some academics suspect the labs time big claims to impress investors.","stressindex":false,"fig":"kkreckons-fig:/figs/2026-11-02-3.jpg","figalt":"Explainer: OpenAI and Anthropic claim AI disproved a 27-year-old hypothesis in computer science; researchers are still checking the proofs.","figcredit":"Original graphic: KKReckons"},{"a":"t","pic":"magnet","i":"chart","cat":"AI business","title":"OpenAI's discounts lure customers from Anthropic before its IPO","ehead":"OpenAI's discounts bite Anthropic","eteaser":"Cheaper models pull startups away ahead of Anthropic's IPO.","url":"https://www.theinformation.com/articles/anthropics-margin-openais-opportunity","src":"The Information","pay":"paid","free":"https://thenextweb.com/news/openai-discounts-anthropic-customers-replit-rippling","freesrc":"The Next Web","themes":["AI","Markets"],"pts":["The Information reports that OpenAI's heavy discounts on its models and its Codex coding tool are pulling some business away from Anthropic. At HR software firm Rippling, Anthropic's share of coding work has dropped to 18% since May, with OpenAI now handling most of it.","Replit moved most of its AI spending to OpenAI after a discount of more than 30%, a person familiar said, once Anthropic declined to extend its own discount without a bigger commitment.","Anthropic has largely held firm on pricing and margins, and its new Opus 5.5 model has since retaken the lead on routing service OpenRouter."],"nums":[["18%","Anthropic's share of Rippling's coding work","chart"],["30%+","OpenAI discount that won Replit, per a source","receipt"]],"why":"Switching models now takes hours, not months, so loyalty is thin and price counts. Investors weighing Anthropic's planned listing will ask whether its margins can survive a rival willing to lose money to win share.","flip":"Discounts that deepen losses cannot run forever, and a better model can win customers back fast, as the OpenRouter rebound suggests. A handful of startup anecdotes may also say little about large enterprise contracts.","stressindex":false,"fig":"kkreckons-fig:/figs/2026-11-02-4.jpg","figalt":"Explainer: OpenAI's discounts cut Anthropic's share of Rippling's coding work to 18%; Replit switched after a discount of more than 30%.","figcredit":"Original graphic: KKReckons"},{"a":"p","pic":"agents","i":"rocket","cat":"AI at work","title":"AI agents widen what workers attempt, not just how fast they work","ehead":"Agents change what we attempt","eteaser":"Study finds workers hand agents bigger, broader tasks.","url":"https://hbr.org/2026/07/research-how-ai-agents-broaden-the-scope-of-knowledge-work","src":"Harvard Business Review","pay":"paid","free":"https://research.perplexity.ai/articles/how-ai-agents-reshape-knowledge-work","freesrc":"Perplexity","themes":["AI","Jobs & careers"],"pts":["Perplexity researchers compared the same users on its chat assistant and its autonomous agent from February to May 2026. The agent worked alone far longer per task and paused often to check in, yet users rarely stopped it.","Counting the human follow-up, agent workflows cut task time by about 87% in their estimate, and users were less often dissatisfied.","The bigger shift was scope: people handed agents harder, multi-step work outside their own field, and about 23% of agent tasks were ones they never tried with the assistant."],"nums":[["87%","Estimated cut in task time with an agent","clock"],["23%","Agent tasks never tried with the assistant","rocket"]],"why":"Dashboards that count hours saved will miss the real change: people stepping into other people's jobs. Managers need to rethink roles, decide who reviews work done outside someone's expertise, and set clear points where a human signs off.","flip":"The authors work at Perplexity, studied early power users of their own product and call the magnitudes approximate. Crossing into unfamiliar fields also means more output that its user cannot properly judge.","fig":"kkreckons-fig:/figs/2026-11-02-5.jpg","figalt":"Explainer: Perplexity's study finds agents cut task time by about 87% and 23% of agent tasks were new to users.","figcredit":"Original graphic: KKReckons"},{"a":"g","pic":"builders","i":"jobs","cat":"Work","title":"Companies court women to fill skilled trade jobs","ehead":"Builders go looking for women","eteaser":"Perks and respect to fix a skilled trade shortage.","url":"https://www.wsj.com/economy/jobs/companies-have-a-solution-for-the-skilled-trade-shortage-more-women-37851f46","src":"The Wall Street Journal","pay":"paid","themes":["Jobs & careers"],"pts":["The Wall Street Journal reports that builders short of workers are courting women with paid maternity leave, flexible hours, properly sized gear and cleaner sites. Women make u
