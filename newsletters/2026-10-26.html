dlord rather than an owner of its own AI economy.","flip":"Local compute cuts latency and cost for Indian startups, which is how ecosystems begin. And India may not need frontier-scale models to use AI well, as Mint itself argues.","fig":"kkreckons-fig:/figs/2026-10-26-3.jpg","figalt":"Explainer: India holds about 3% of global data-centre capacity against nearly 20% of the world's data; Google, Microsoft and AWS are investing $15bn, $20.5bn and over $21bn.","figcredit":"Original graphic: KKReckons"}],"world":[{"a":"p","pic":"frogbond","i":"bank","cat":"Euro debt","wide":true,"title":"France's 10-year bond yield tops 5% as investors weigh euro contagion","ehead":"Paris pays the price","eteaser":"Why France became the bond market's weakest link","url":"https://www.wsj.com/world/europe/how-france-became-the-poster-child-for-debt-woes-08c64b3d","url2":"https://www.cnbc.com/2026/10/23/france-debt-euro-zone-contagion.html","src":"The Wall Street Journal and CNBC","pay":"paid","free":"https://www.cnbc.com/2026/10/23/france-debt-euro-zone-contagion.html","freesrc":"CNBC","themes":["Markets","Geopolitics"],"pts":["France's 10-year yield rose above 5% for the first time since 2002, CNBC reports, and its premium over Germany is the widest since the euro crisis. The euro is down almost 5% against the dollar this year, and 2026 growth is forecast at 0.5%.","A WSJ column by James Mackintosh calls France the weakest link in a world of higher rates: a deficit near 5% of GDP against nominal growth of 3% at best, taxes already near their limit, and voters refusing cuts.","Most analysts CNBC spoke to see contagion as limited: stronger banks, ECB tools and trusted statistics, unlike Greece in 2009."],"nums":[["5%+","10-year yield, first since 2002","chart"],["119%","Debt to GDP, Q2 2026","bank"],["0.5%","2026 growth forecast","gauge"]],"why":"This is a political crisis in a bond-market costume. The maths is fixable; the politics is not, because the older voters who hold most of the wealth and turn out most also defend the pensions that make the sums hard.","flip":"A 5% yield is not panic territory, and the ECB would likely step in long before Italy-style spreads. If a credible spending plan emerges after the next election, today's sell-off could look like a buying opportunity.","cite":"France's 10-year government bond yield rose above 5% for the first time since 2002 in the week to 23 October 2026, CNBC reported.","fig":"kkreckons-fig:/figs/2026-10-26-4.jpg","figalt":"Visual explainer: France's 10-year yield passed 5%, debt is 119% of GDP and growth is forecast at 0.5%; a deficit near 5% against 3% growth feeds a debt spiral, while over-60s, who hold 60% of wealth, resist pension cuts. Analysts see limited contagion.","figcredit":"Original graphic: KKReckons"},{"a":"o","pic":"gradcap","i":"jobs","cat":"Jobs & AI","title":"Young US graduates fear AI is shutting them out of entry-level jobs","ehead":"The missing first rung","eteaser":"Stanford finds young coders' employment down 19%","url":"https://www.ft.com/content/0a86d4f5-6046-4c1c-89e9-90583cff33f9?syn-25a6b1a6=1","src":"Financial Times","pay":"paid","themes":["Jobs & careers","AI"],"pts":["In Pennsylvania's Lehigh Valley, the FT meets young graduates who say AI is closing the door to first jobs. A 2022 computer-science graduate says almost every interview now asks whether he is needed at all.","Stanford research finds employment of software developers aged 22 to 25 down 19%, with customer service hit similarly, while jobs AI cannot do, such as health aides, are growing.","There are no mass AI lay-offs yet; the squeeze is in hiring. One Lehigh student chose a master's degree over a job hunt to stay ahead of the machines."],"nums":[["−19%","Software developers aged 22–25","jobs"]],"why":"The first AI casualty is not the job you have but the one you never get. Cut the bottom rung and a generation loses the training that turns graduates into seniors.","flip":"Hiring freezes also follow rate rises and post-pandemic over-hiring, and the data show slower hiring, not firing. Earlier technology shifts also killed entry roles before creating new ones.","fig":"kkreckons-fig:/figs/2026-10-26-5.jpg","figalt":"Explainer: Stanford research finds employment of US software developers aged 22 to 25 down 19%; customer service is similar while health-aide jobs grow, and there are no mass AI lay-offs yet.","figcredit":"Original graphic: KKReckons"},{"a":"g","pic":"piggy","i":"chip","cat":"AI financing","tag":"Opinion","stressindex":true,"title":"Who's paying for the AI build-out? Savers, pensions and insurers","ehead":"Your pension owns a data centre","eteaser":"A $10.3tn build-out, funded by everyone's savings","url":"https://www.ft.com/content/09f56730-4702-446d-9986-f7c93ffe6bf0?syn-25a6b1a6=1","src":"Financial Times","pay":"paid","free":"https://www.brookings.edu/articles/the-10-trillion-question-financing-the-ai-buildout/","freesrc":"Brookings","themes":["AI","Markets"],"pts":["FT columnist Robert Armstrong argues that almost every big pool of capital in the rich world is now funding AI data centres, so anyone with savings is exposed.","He cites a Brookings estimate that the US build-out will cost $10.3tn through 2032, more each year than the railroad and interstate booms combined. Hyperscalers are spending all their cash flow, chipmakers are buying stakes in AI labs, and debt is piling up.","Most of that debt is rated investment grade, thanks to hyperscaler guarantees or chips as collateral, which lets it into pensions, annuities and life insurance."],"nums":[["$10.3tn","US AI build-out to 2032 (Brookings)","chip"]],"why":"AI risk no longer sits only with tech shareholders. When the guarantors and the spenders are the same companies, a demand miss would travel through retirement accounts, not just stock tickers.","flip":"Investment-grade ratings reflect borrowers that are among the most profitable firms on earth, and booms that looked reckless, like the railroads, sti
