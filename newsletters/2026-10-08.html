 return `<article class="card c-${s.a}${s.wide?' wide':''}">${s.pic?'':svg(s.i,'wm')}<div class="top">${s.pic&&PICS[s.pic]?`<span class="pic">${PICS[s.pic]}${tiles?`<b class="pn">${n}</b>`:''}</span>`:`<span class="badge">${tiles?`<span class="bn">${n}</span>`:svg(s.i)}</span>`}<div class="hd"><div class="meta">${tiles?'':`<span class="num">${n}</span>`}<span class="cat">${s.cat}</span>${tag}</div><h3>${L(s.url,s.title)}</h3>${s.also&&!IM?`<p class="also">Also read: ${s.also.map(a=>L(a.u,a.t)).join(' · ')}</p>`:''}</div></div><ul>${s.pts.map(p=>`<li>${p}</li>`).join('')}</ul>${nums}${s.why?`<p class="why">${BULB}<span><strong>Why it matters:</strong> ${s.why}</span></p>`:''}${s.flip?`<p class="flip">${FLIP}<span><strong>Other side:</strong> ${s.flip}</span></p>`:''}${s.fig&&!IM?`<figure class="fig"><img src="${s.fig}" alt="${s.figalt||''}" loading="lazy"></figure>`:''}</article>`;
