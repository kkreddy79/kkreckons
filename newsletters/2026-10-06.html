html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--page);color:var(--text);font-family:'Heros','Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.page{max-width:1024px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column}
.canvas{width:1024px;height:1536px;overflow:hidden}
.inner{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:12px 18px 12px}
.canvas .inner{justify-content:space-between}
.inner>*{flex-shrink:0}
a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}
a:focus-visible{outline:2px solid #E64980;outline-offset:2px}
.c-o{--a:var(--o);--at:var(--o-t)}.c-t{--a:var(--t);--at:var(--t-t)}.c-v{--a:var(--v);--at:var(--v-t)}.c-p{--a:var(--p);--at:var(--p-t)}.c-y{--a:var(--y);--at:var(--y-t)}.c-b{--a:var(--b);--at:var(--b-t)}
/* header band */
.band{position:relative;flex:none;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:linear-gradient(90deg,var(--band1),var(--band2) 50%,var(--band3));overflow:hidden}
.band .sky{position:absolute;left:0;bottom:0;width:100%;height:54px;opacity:.16}
.dt{position:relative;font:700 29px/1 'Pagella',Palatino,Georgia,serif;color:var(--ink);letter-spacing:.2px}
.by{position:relative;font:italic 400 19px/1 'Pagella',Palatino,Georgia,serif;color:#C2255C}
/* callout */
.callout{flex:none;display:grid;grid-template-columns:1fr 1fr;border-radius:14px;overflow:hidden;box-shadow:0 4px 14px rgba(43,19,72,.14)}
.co{display:flex;align-items:center;gap:13px;padding:12px 18px;color:#fff}
.co1{background:linear-gradient(100deg,#F5620F,#E03131)}.co2{background:linear-gradient(100deg,#7C4DFF,#4C3BCF)}
.co .ic{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.co .ic svg{width:26px;height:26px;fill:none;stroke:#FFE9A8;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.big{font:700 40px/1 'Pagella',Palatino,Georgia,serif;color:#FFF1B8;white-space:nowrap;text-shadow:0 2px 6px rgba(0,0,0,.15)}
.co p{font-size:15.5px;line-height:1.32;color:#FFF4F8}.co b{color:#fff}
/* section headers */
.ed{display:flex;flex-direction:column;gap:9px}
.edh{display:flex;align-items:flex-end;gap:12px;height:34px}
.pill{font:700 18px/1 'Heros',Helvetica,sans-serif;color:#fff;padding:8px 16px;border-radius:10px;white-space:nowrap;box-shadow:0 3px 8px rgba(43,19,72,.15)}
.p-pick{background:linear-gradient(90deg,#F08C00,#E8590C)}.p-india{background:linear-gradient(90deg,#F76707,#E64980)}.p-world{background:linear-gradient(90deg,#AE3EC9,#6741D9)}
.deco{flex:1;height:30px;min-width:0}
/* cards */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--a);border-radius:14px;padding:12px 15px;display:flex;flex-direction:column;gap:7px;box-shadow:0 2px 10px rgba(43,19,72,.07)}
.card::before{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,var(--at) 0%,transparent 68%);pointer-events:none}
.card>*{position:relative}
.card>.wm{position:absolute;right:8px;bottom:4px;width:118px;height:118px;opacity:.09;fill:none;stroke:var(--a);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.top{display:flex;gap:11px;align-items:center}
.badge{width:46px;height:46px;border-radius:50%;background:var(--a);display:grid;place-items:center;flex:none;box-shadow:0 3px 8px rgba(43,19,72,.18)}
.badge svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hd{flex:1;min-width:0}
.meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.num{width:21px;height:21px;border-radius:50%;background:var(--a);color:#fff;display:grid;place-items:center;font:700 12px/1 'Heros',sans-serif;flex:none}
.cat{font-size:14px;font-weight:700;color:var(--a)}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--muted);background:var(--card)}
.card h3{font:700 20.5px/1.17 'Pagella',Palatino,Georgia,serif;color:var(--ink);margin-top:3px}
.card ul{list-style:none;display:flex;flex-direction:column;gap:3px}
.card li{font-size:15.5px;line-height:1.4;padding-left:14px;position:relative;color:var(--text)}
.card li::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--a)}
.nums{display:flex;background:var(--at);border-radius:10px;padding:7px 12px}
.nums div{flex:1;min-width:0}
.nums div+div{border-left:1px solid var(--line);padding-left:10px;margin-left:10px}
.nums b{display:block;font:700 22px/1.08 'Pagella',Palatino,Georgia,serif;color:var(--a);white-space:nowrap}
.nums span{display:block;font-size:12.5px;line-height:1.22;color:var(--muted)}
.nums svg{display:block;width:24px;height:24px;margin:0 auto 3px;fill:none;stroke:var(--a);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tiles{background:none;padding:0;gap:8px}
.tiles div{background:var(--at);border-radius:12px;padding:8px 6px;text-align:center}
.tiles div+div{border:0;margin:0;padding-left:6px}
.why,.flip{display:flex;gap:7px;font-size:15px;line-height:1.32;grid-column:1/-1}
.why svg,.flip svg{width:16px;height:16px;flex:none;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.why svg{stroke:var(--why)}.why strong{color:var(--why)}
.flip{color:var(--flip);font-style:italic}.flip svg{stroke:var(--flip)}.flip strong{font-weight:700}
.card.wide{grid-column:1/-1;display:grid;grid-template-columns:1.25fr 1.25fr 1.25fr;align-items:center;gap:8px 16px}
.card.wide h3{font-size:22px}
/* slice, cta, reading */
.slice{flex:none;display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#FFEFF6,#F4EDFF);border:1.5px dashed #E6498080;border-radius:14px;padding:10px 16px;color:#4A1836}
.slice .si{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#F06595,#CC5DE8);display:grid;place-items:center;flex:none}
.slice .si svg{width:21px;height:21px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.slice b{font:italic 700 24px/1 'Pagella',Palatino,Georgia,serif;color:#D6336C;white-space:nowrap}
.slice span{font:italic 400 19.5px/1.3 'Pagella',Palatino,Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .slice{background:#3A1B2C;color:#FBD5E5}}
:root[data-theme="dark"] .slice{background:#3A1B2C;color:#FBD5E5}
.cta{flex:none;align-self:center;font:700 15px/1 'Heros',sans-serif;color:#3B2FA8;background:#EFEAFF;border:1px solid #CFC4FF;padding:7px 20px;border-radius:999px}
body:not(.img) .cta{display:none}
.reading{flex:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 18px}
.reading h4{font:700 19px 'Pagella',Palatino,Georgia,serif;margin:0 0 6px;color:var(--ink)}
.reading ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.reading li{font-size:15px;line-height:1.4;color:var(--muted)}
.reading li a{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.wfoot{flex:none;text-align:center;font-size:12.5px;color:var(--muted);padding:2px 0 6px}
body.img .reading,body.img .wfoot{display:none}
@media (max-width:760px){.inner{padding:12px}.band{height:auto;padding:12px 14px;flex-wrap:wrap;gap:6px}.dt{font-size:23px}
 .callout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.card.wide{display:flex}.deco{display:none}.slice{flex-wrap:wrap}}
.ireading{flex:none;display:none;flex-direction:column;gap:9px}
body.img .ireading{display:flex}
.p-read{background:linear-gradient(90deg,#0B9484,#2B6FDB)}
.ireading ol{list-style:none;display:grid;grid-template-columns:1fr;gap:8px}
.ireading li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--a);border-radius:12px;padding:10px 14px;font:700 19px/1.25 'Pagella',Palatino,Georgia,serif;color:var(--ink);box-shadow:0 2px 8px rgba(43,19,72,.06)}

<script>

const L=(u,t)=>u?`<a href="${u}" target="_blank" rel="noopener">${t}</a>`:t;
function card(n,s,tiles){

 const tag=s.tag?`<span class="tag">${s.tag}</span>`:'';
 const nums=s.nums&&s.nums.length?`<div class="nums${tiles?' tiles':''}">${s.nums.map(([v,l,i])=>`<div>${tiles&&i?svg(i):''}<b>${v}</b><span>${l}</span></div>`).join('')}</div>`:'';
 return `<article class="card c-${s.a}${s.wide?' wide':''}">${s.pic?'':svg(s.i,'wm')}<div class="top">${s.pic&&PICS[s.pic]?`<span class="pic">${PICS[s.pic]}${tiles?`<b class="pn">${n}</b>`:''}</span>`:`<span class="badge">${tiles?`<span class="bn">${n}</span>`:svg(s.i)}</span>`}<div class="hd"><div class="meta">${tiles?'':`<span class="num">${n}</span>`}<span class="cat">${s.cat}</span>${tag}</div><h3>${L(s.url,s.title)}</h3></div></div><ul>${s.pts.map(p=>`<li>${p}</li>`).join('')}</ul>${nums}${s.why?`<p class="why">${BULB}<span><strong>Why it matters:</strong> ${s.why}</span></p>`:''}${s.flip?`<p class="flip">${FLIP}<span><strong>Other side:</strong> ${s.flip}</span></p>`:''}</article>`;
