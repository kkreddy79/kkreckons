ain small. One in two borrowers took another gold loan within a year.","ET Prime describes an informal rollover at bank branches: when a one-year loan falls due and the borrower can't pay, a moneylender bridges it for a day for a fee, the loan is closed and a new one opened, so no default shows.","Bajaj Finance has stopped short-tenor gold schemes after overdue loans rose. Piramal Finance's Jairam Sridharan says 15% to 23% of the industry's gold loan disbursements last year went to borrowers already 90+ days overdue elsewhere."],"why":"Gold loans are now a mainstream source of household credit. If fresh loans are paying off old ones, clean books may be masking stretched borrowers, and a fall in gold prices would test the collateral everyone leans on.","flip":"The gold sits in the vault, so lenders rarely lose money even when borrowers struggle, and the branch rollovers come from an on-ground check, not data. For a household needing quick cash, is a renewed gold loan worse than a moneylender?","fig":"kkreckons-fig:/figs/2026-11-13-2.jpg","figalt":"Explainer: India's gold loan book tripled to ₹22.5 lakh crore in three years, while informal rollovers may hide borrower stress.","figcredit":"Original graphic: KKReckons"},{"a":"b","pic":"builders","i":"globe","cat":"Trade policy","tag":"Opinion","wide":false,"title":"Trade deals could squeeze Make in India's public procurement edge","ehead":"Trade deals vs Make in India","eteaser":"Opening government tenders could cost local makers, warns an ex-secretary.","url":"https://www.livemint.com/opinion/columns/potential-adverse-impact-of-ftas-on-public-procurement-policies-supporting-made-in-india-11794295722655.html","src":"Mint","pay":false,"themes":["India","Geopolitics"],"pts":["Retired Government of India secretary Aruna Sharma argues that opening government buying to foreign suppliers under trade deals could clash with Make in India preferences that help local makers, especially MSMEs. Dairy and textiles may be most exposed.","She notes the EU has long pushed to bring procurement under non-discrimination rules, and that past deals did not always give India equal access in return; India has used safeguards against import surges, including from South Korea.","Deals with the UK, EFTA and the UAE show procurement is now on the table. She wants any opening tied to real reciprocity, investment and technology transfer, with care in railways, energy, space and defence."],"why":"Government buying is one of India's strongest levers for factory jobs. How much of it is traded away in talks with the EU, the US and others will decide whether MSMEs keep a home market or meet foreign rivals in it.","flip":"Local-preference rules can also mean higher prices and weaker competition for taxpayers. Opening tenders may be the price of wider access for Indian exporters, and foreign bidders could bring better technology. Is shelter or competition the faster route to capability?","fig":"kkreckons-fig:/figs/2026-11-13-3.jpg","figalt":"Explainer: how opening public procurement in trade deals could affect Make in India preferences, and the safeguards the author asks for.","figcredit":"Original graphic: KKReckons"}],"world":[{"a":"p","pic":"boardq","i":"eye","cat":"Corporate governance","wide":true,"title":"Inside Jensen Huang's fall: a spy scandal and a 'feudal' Nvidia","ehead":"How Huang's empire cracked","eteaser":"A suspected spy, two affairs and no one to say no.","url":"https://www.ft.com/content/ef8f85a6-e2d7-4d41-b70e-092b2567813a?syn-25a6b1a6=1","url2":"https://www.nytimes.com/2026/11/12/opinion/jensen-huang-nvidia.html","src":"Financial Times and The New York Times","pay":"paid","themes":["AI","Geopolitics"],"pts":["Nvidia's board met late into the night before Huang quit, ending 33 years at the company he co-founded, the FT reports. US agencies suspected a woman he admitted an affair with, an executive at Singapore client MegaSpeed, of spying for China; reports of an alleged affair with a subordinate e.","The Fed raised rates in September and traders expect more. Jefferies expects October's rate jump to weigh on sales in November and December."],"nums":[["5.5%","fall in October sales","home"],["7.5%","peak mortgage rate, early October","chart"]],"why":"Housing is where higher rates hit households first. Frozen sales lock owners into old mortgages, slow moves for new jobs and cut spending on everything a new home brings, and affordability already shaped the midterms.","flip":"What to watch: the Fed's meeting next month, where traders expect a quarter-point rise. Slower sales are not falling prices, and owners on cheap mortgages can wait. If inflation cools and yields ease, could pent-up demand return fast?","fig":"kkreckons-fig:/figs/2026-11-13-5.jpg","figalt":"Explainer: US existing-home sales fell 5.5% in October to the slowest pace since 2010 as mortgage rates rose.","figcredit":"Original graphic: KKReckons"},{"a":"y","pic":"swissbank","i":"bank","cat":"Swiss banking","wide":false,"title":"Sberbank Switzerland rescue: TradeX owners settle after 4-year feud","ehead":"A Swiss rescue gone sour","eteaser":"A sanctioned Russian bank, two buyers, four years of fights.","url":"https://www.ft.com/content/8d5aaf6c-e8b6-47ac-a111-a5827fce2175?syn-25a6b1a6=1","src":"Financial Times","pay":"paid","themes":["Banking","Geopolitics"],"pts":["In September 2022 Swiss regulator Finma briefly eased sanctions curbs so Sberbank's Zurich arm could be sold. Stephen Lynch and Abdallah Chatila bought it for about SFr130mn and renamed it TradeXBank.","Chatila financed his side with costly bonds through his m3 group, fell behind on payments and fell out with Lynch, who won an arbitration and froze some m3 shares. By 2025 more than 40% of the bank's shares were pledged to creditors, the FT reports.","Finma warned in October of possible liquidation. This week the owners settled: Lynch drops his claims for a bigger stake, and Chatila wants to sell out."],"nums":[["SFr130mn","paid to Sberbank in 2022","bank"],[">40%","of shares pledged to creditors","chart"]],"why":"Sanctions forced rushed sales of Russian assets across the West. This one shows how a rescue that looks neat on day one can leave a regulated bank with debt-stretched owners, and it adds to doubts about Finma's grip after Credit Suisse.","flip":"Finma did ringfence the bank, which still operates and says it has no Russian shareholders. Liquidating it in 2022 could have meant years of legal limbo and lost jobs. Was a messy survival really worse than a clean shutdown?","fig":"kkreckons-fig:/figs/2026-11-13-6.jpg","figalt":"Explainer: Sberbank's Swiss arm was sold for SFr130mn in 2022, then its owners feuded and pledged more than 40% of its shares to creditors.","figcredit":"Original graphic: KKReckons"},{"a":"g","pic":"rxphone","i":"pill","cat":"AI and health","tag":"Opinion","title":"How Gemini helped a WSJ writer get an endometriosis diagnosis","ehead":"The chatbot that believed her","eteaser":"Two decades of pain, one AI hunch, a diagnosis at last.","url":"https://www.wsj.com/health/wellness/how-ai-diagnosed-a-medical-mystery-my-doctors-missed-for-decades-cd5fa842","src":"The Wall Street Journal","pay":"paid","free":"https://www.livemint.com/global/how-ai-diagnosed-a-medical-mystery-my-doctors-missed-for-decades-11794533214112.html","freesrc":"Mint","themes":["Health & science","AI"],"pts":["WSJ writer Katherine Bindley spent two decades with pain episodes, ER visits and negative tests. When she gave Google's Gemini her history, it said she likely had adenomyosis and endometriosis, which earlier scans and surgery had not found.","An MRI showed no sign of endometriosis, but a specialist's dynamic ultrasound led to both diagnoses, and two more specialists agreed. The disease typically takes eight to 12 years to diagnose. She now plans excision surgery.","Harvard's Isaac Kohane warns that AI can be wrong and stir anxiety, yet urges patients to use it to prepare for appointments."],"why":"Doc
