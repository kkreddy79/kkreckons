 return `<article class="card c-${s.a}${s.wide?' wide':''}">${s.pic?'':svg(s.i,'wm')}<div class="top">${s.pic&&PICS[s.pic]?`<span class="pic">${PICS[s.pic]}${tiles?`<b class="pn">${n}</b>`:''}</span>`:`<span class="badge">${tiles?`<span class="bn">${n}</span>`:svg(s.i)}</span>`}<div class="hd"><div class="meta">${tiles?'':`<span class="num">${n}</span>`}<span class="cat">${s.cat}</span>${tag}</div><h3>${L(s.url,s.title)}</h3></div></div><ul>${s.pts.map(p=>`<li>${p}</li>`).join('')}</ul>${nums}${s.why?`<p class="why">${BULB}<span><strong>Why it matters:</strong> ${s.why}</span></p>`:''}${s.flip?`<p class="flip">${FLIP}<span><strong>Other side:</strong> ${s.flip}</span></p>`:''}${s.fig&&!IM?`<figure class="fig"><img src="${s.fig}" alt="${s.figalt||''}" loading="lazy"></figure>`:''}</article>`;
}
const DECO=JSON.parse(document.getElementById('deco').textContent);const PIL=JSON.parse(document.getElementById('pilli').textContent);const PICS=JSON.parse(document.getElementById('pics').textContent);
function section(label,key,items){if(!items||!items.length)return '';return `<section class="ed" id="${key}"><div class="edh"><span class="pill p-${key}"><svg viewBox="0 0 24 24" aria-hidden="true">${PIL[key]||''}</svg>${label}</span>${DECO[key]}</div><div class="grid">${(document.body.classList.contains('img')?items.filter(x=>!x.noimg):items).map((s,i)=>card(i+1,s,key==='pick')).join('')}</div></section>`;}

document.getElementById('content').innerHTML=
 `<section class="slice top" aria-label="Today’s slice"><span class="sw"><svg class="cakei" viewBox="0 0 48 48" aria-hidden="true"><path d="M6 30 L40 18 L42 34 L8 40 Z" fill="#FFE8CC"/><path d="M6 30 L40 18 L41 24 L7 35 Z" fill="#FFC9DE"/><path d="M8 40 L42 34 L42 38 L8 44 Z" fill="#F4A261"/><path d="M6 30 Q14 22 24 24 Q34 18 40 18 L40 21 Q32 22 24 27 Q14 25 7 33 Z" fill="#fff"/><circle cx="33" cy="15" r="5" fill="#E03131"/><path d="M33 10 q2 -4 5 -4" stroke="#2F9E44" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="22" y="34" font-family="Lora,Georgia,serif" font-weight="700" font-size="8" fill="#C2255C" transform="rotate(-12 22 34)">KK</text></svg></span><span class="st"><span class="sd"><span class="dtx">${D.date}</span><b>Today’s slice</b></span><span class="sl">${D.slice}</span></span></section>`+
 `<div class="callout">${D.callout.map((c,k)=>`<div class="co co${k+1}"${c.bg?` style="background:${c.bg}"`:''}><span class="ic">${svg(c.i||'chart')}</span><span class="big">${L(c.url,c.num)}</span><p>${L(c.url,`<b>${c.lead}</b>`)}${c.rest}</p></div>`).join('')}</div>`+
 section('Pick of the day','pick',D.pick)+section('India edition','india',D.india)+section('World edition','world',D.world)+
 (D.reading&&D.reading.some(r=>r.img)?`<section class="ireading ed"><div class="edh"><span class="pill p-read">Also worth a read</span>${DECO.pick}</div><ol>${D.reading.filter(r=>r.img).map((r,k)=>`<li class="c-${['v','p','y'][k%3]}"><span class="badge">${svg(r.i||['chart','bank','eye'][k%3])}</span>${r.img}</li>`).join('')}</ol></section>`:'')+
 (D.reading&&D.reading.length?`<section class="reading"><h4>Further reading</h4><ul>${D.reading.map(r=>`<li>${L(r.url,r.title)}${r.note?` — ${r.note}`:''}</li>`).join('')}</ul></section>`:'')+
  `<p class="wfoot">KKReckons · Curated by KK Reddy · For information only. Not financial, legal or career advice.</p>`;
