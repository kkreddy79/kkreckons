 try{window.buildHeader&&window.buildHeader(D);}catch(e){}
 const groups=[...tmp.querySelectorAll('g')].map(g=>g.innerHTML).join('');tmp.remove();

 let refl='';for(let i=0;i<7;i++){refl+=`<rect x="${sunX-60+i*6}" y="${150+i*3}" width="${120-i*12}" height="1.6" fill="${p[3]}" opacity="${.55-i*.06}"/>`;}

 <radialGradient id="v8g"><stop offset="0" stop-color="${p[3]}" stop-opacity=".95"/><stop offset=".35" stop-color="${p[3]}" stop-opacity=".45"/><stop offset="1" stop-color="${p[3]}" stop-opacity="0"/></radialGradient>
 <linearGradient id="v8w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p[1]}"/><stop offset="1" stop-color="${p[0]}"/></linearGradient>
 <linearGradient id="v8v" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".38"/><stop offset=".55" stop-color="#000" stop-opacity=".08"/><stop offset="1" stop-color="#000" stop-opacity=".2"/></linearGradient></defs>
 <rect width="1024" height="170" fill="url(#v8s)"/><circle cx="${sunX}" cy="146" r="150" fill="url(#v8g)"/><circle cx="${sunX}" cy="146" r="26" fill="${p[3]}"/>
 <g transform="translate(0,42)" fill="${p[4]}" color="${p[4]}" opacity=".92">${groups}</g>

 <rect width="1024" height="170" fill="url(#v8v)"/>`;
 s.querySelectorAll('[fill^="url(#h"]').forEach(e=>e.setAttribute('fill',p[4]));
 // cake on a plate
 const ck=st.querySelector('.cakei');if(ck){ck.setAttribute('viewBox','0 0 48 46');ck.insertAdjacentHTML('afterbegin','<ellipse cx="24" cy="42" rx="22" ry="3.6" fill="#fff"/><ellipse cx="24" cy="41.4" rx="17" ry="2.2" fill="#E9ECEF"/>');}
 // last sentence of the slice in gold italic
 const sl=st.querySelector('.sl');const m=(D.slice||'').match(/^(.*[.!?])\s+([^.!?]+[.!?])\s*$/);
 if(sl&&m)sl.innerHTML=`${m[1]} <em>${m[2]}</em>`;
}
/* section dividers: India landmarks at dusk; Alps for the World edition */
const pin=document.querySelector('#india .deco');
if(pin){
 const ROT=['taj','indiagate','charminar','gopuram','qutub','lotus','hawamahal','gateway','howrah'];let all='';
 for(let k=0;k<4;k++){
  const tmp=document.createElementNS('http://www.w3.org/2000/svg','svg');tmp.id='hsky';document.body.appendChild(tmp);
  try{window.buildHeader&&window.buildHeader({...D,date:D.date+k,header:{india:ROT.slice(k*2).concat(ROT.slice(0,k*2)),usa:[]}});}catch(e){}
  const g=tmp.querySelector('g');if(g)all+=`<g transform="translate(${k*470},0)">${g.innerHTML}</g>`;tmp.remove();
 }
 pin.setAttribute('viewBox','0 34 1880 70');pin.setAttribute('preserveAspectRatio','xMinYMax slice');
 pin.innerHTML=`<defs><linearGradient id="v8ih" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1880" y2="0"><stop offset="0" stop-color="#F76707"/><stop offset=".5" stop-color="#E64980"/><stop offset="1" stop-color="#F59F00"/></linearGradient>
 <linearGradient id="v8ig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD8A8" stop-opacity="0"/><stop offset="1" stop-color="#FFC078" stop-opacity=".6"/></linearGradient></defs>
 <rect x="0" y="34" width="1880" height="70" fill="url(#v8ig)"/>
 <g fill="url(#v8ih)" color="#E8590C" opacity=".6">${all}</g>`;
 pin.querySelectorAll('[fill^="url(#h"]').forEach(e=>e.removeAttribute('fill'));
}
const pw=document.querySelector('#world .deco');
if(pw){

 const path=a=>'M0 40 '+a.map(([x,y])=>`L${x} ${y}`).join(' ')+' L760 40Z';
 const snow=peaks.filter(([x,y])=>y<14).map(([x,y])=>`<path d="M${x-7} ${y+7}L${x} ${y}L${x+7} ${y+7}L${x+3.5} ${y+5.5}L${x} ${y+8.5}L${x-3.5} ${y+5.5}Z" fill="#fff"/>`).join('');
 pw.setAttribute('viewBox','0 0 760 40');pw.setAttribute('preserveAspectRatio','none');
 pw.innerHTML=`<defs><linearGradient id="v8w1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7048E8"/><stop offset="1" stop-color="#1C7ED6"/></linearGradient></defs>
 <path d="${path(back)}" fill="#A5D8FF" opacity=".45"/><path d="${path(peaks)}" fill="url(#v8w1)" opacity=".55"/>${snow}`;
}
})();
