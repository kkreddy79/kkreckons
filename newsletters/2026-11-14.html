cal option also keeps more AI spending at home.","flip":"Sarvam's spending is tiny next to US rivals, and foreign giants are giving Indian consumers premium AI free for long periods. A home model running on imported chips may reduce dependence, not end it.","cite":"Indian AI start-up Sarvam completed a series B funding round in August 2026 that valued it at $1.5bn, the Financial Times reported.","stressindex":false,"fig":"kkreckons-fig:/figs/2026-11-14-2.jpg","figalt":"Explainer: Sarvam's plan for low-cost Indian-language AI models and the hurdles it faces.","figcredit":"Original graphic: KKReckons"}],"india":[{"a":"t","pic":"gradcap","i":"grad","cat":"Education / Visas","wide":true,"title":"Visa curbs squeeze universities that relied on foreign students","ehead":"The cash cow runs dry","eteaser":"Visa curbs leave universities short of foreign fees","url":"https://m.economictimes.com/nri/study/the-foreign-student-cash-cow-is-running-dry-as-us-uk-others-tighten-visa-rules/articleshow/135790898.cms","src":"The Economic Times","pay":false,"themes":["India","Jobs & careers"],"pts":["Tighter visa rules are cutting into universities' fee income, ET reports. UK study visas fell 11% to 383,000 in the year to June 2026, 41% below the 2023 peak; Indians got 83,000 of them.","Canada's full-time international enrolment at public institutions is down about 29% since 2023-24, with colleges hit hardest. In England, 35.8% of institutions ran a deficit in 2024-25, and that could reach 42.7%.","In the US, international master's students in science and engineering fell 24% between 2024 and 2025."],"nums":[["-41%","UK study visas vs 2023 peak","grad"],["83,000","UK study visas to Indians","plane"]],"why":"Indian families weighing a costly foreign degree face a moving target: fewer visas, weaker post-study work options, and universities that may cut courses to plug the gap. Check a university's finances and visa rules, not just its ranking.","flip":"Governments say the curbs ease pressure on housing and protect programme quality, and Australia's university enrolment barely fell. Students may switch countries rather than give up on studying abroad.","cite":"UK sponsored study visas fell 11% to 383,000 in the year ending June 2026, 41% below the peak in the year ending June 2023, ET Online reported.","stressindex":false,"fig":"kkreckons-fig:/figs/2026-11-14-3.jpg","figalt":"Explainer: tighter student visa rules in the UK, Canada and US are cutting universities' international enrolment and fee income.","figcredit":"Original graphic: KKReckons"}],"world":[{"a":"p","pic":"server","i":"cloud","cat":"Big Tech / Cloud","wide":true,"title":"Microsoft Outlook outage hits 70+ countries for about 19 hours","ehead":"The day email stopped","eteaser":"Microsoft's long outage, and who quietly enjoyed it","url":"https://www.wsj.com/business/telecom/the-chaos-and-unexpected-joys-of-a-19-hour-global-email-outage-37b7170c","url2":"https://www.ft.com/content/f385935b-2bb4-4e34-8127-16517e8ceecb?syn-25a6b1a6=1","src":"The Wall Street Journal, Financial Times and WIRED","pay":"paid","free":"https://www.cnbc.com/2026/11/12/microsoft-outage-outlook-aws-google.html","freesrc":"CNBC","themes":["Jobs & careers"],"pts":["A Microsoft network upgrade went wrong and took Outlook email offline for about 19 hours, the WSJ reports. Microsoft says it was not hacked.","The FT says users in more than 70 countries were hit, from Goldman Sachs to NHS staff on paper records and a Colorado sheriff asking for bail in cash. Some workers treated it as a snow day; one built bookshelves.","WIRED says officials, including the chair of a UK parliamentary committee, called for less reliance on tech giants, as France and others build local alternatives to US software."],"nums":[["19 hrs","email down (WSJ)","clock"],["70+","countries hit (FT)","globe"]],"why":"A handful of cloud providers now carry much of the world's daily work, so one bad upgrade becomes a global event. Know which tasks stop when
