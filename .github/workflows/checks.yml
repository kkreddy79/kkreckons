# Checks every pull request before Krishnakanth looks at the Vercel preview:
# edition content rules, the build, publishing QC, and a browser + accessibility pass over every page type.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: these jobs only check out code and run checks.
permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Fails on a high or critical advisory in a package the site ships (not dev tools).
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Content check (sources, summaries, quotes, image credits, alt text)
        run: npm run -s check

      - name: Build
        run: npm run -s build

      # Edition pull requests (edition/*) may only touch edition files; any other branch is a site change.
      - name: Publishing QC
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q origin main
          if [[ "${{ github.head_ref }}" == edition/* ]]; then npm run -s qc; else npm run -s qc -- --site-change; fi

      # Every page on eight device sizes (phones, tablets, laptops, desktop) in Chromium, plus iPhone, tablet and
      # laptop sizes in WebKit, the engine behind Safari on every iPhone and iPad.
      - name: Browser, device and accessibility check
        run: |
          npx playwright install --with-deps chromium webkit
          npx next start -p 3000 &
          timeout 60 bash -c 'until curl -s -o /dev/null http://localhost:3000; do sleep 1; done'
          npm run -s site-check
