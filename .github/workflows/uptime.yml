# Once a day, checks the live site: key pages, sitemaps, the feed, the newest edition, AI Stress Index data
# freshness and the kkreckons.com → www redirect. A failed run emails the repository owner (GitHub's default).
name: Uptime

on:
  schedule:
    - cron: "17 3 * * *" # 08:47 IST
  workflow_dispatch:

# Read-only token: these jobs only check out code and run checks.
permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check kkreckons.com
        run: node scripts/uptime.mjs https://www.kkreckons.com
