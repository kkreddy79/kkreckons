name: AI Implosion data

# Refreshes data/ai-implosion.json and the Excel workbook every weekday after the US close
# (22:17 UTC = 3:17 pm PDT / 2:17 pm PST). The commit triggers a Vercel redeploy of
# kkreckons.com/ai-implosion. Also runs when the dashboard code changes, or by hand
# from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "17 22 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - "ai-implosion/**"
      - ".github/workflows/ai-implosion.yml"

permissions:
  contents: write

concurrency:
  group: ai-implosion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - name: Fetch prices and rebuild dashboard data
        run: python ai-implosion/update_dashboard.py
      - name: Commit updated data
        run: |
          git config user.name "kkreckons-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai-implosion.json public/ai-implosion/AI_Implosion_Dashboard.xlsx
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "AI Implosion data: $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
