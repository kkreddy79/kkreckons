# Weekly pull requests for outdated npm packages and GitHub Actions (security fixes arrive as soon as they're
# published). Each one runs the full Checks workflow before anything is merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
